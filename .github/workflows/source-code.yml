name: Source Code (with Git History)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create source archive
        run: |
          mkdir archive

          rsync -a \
            --exclude archive \
            --exclude .github \
            ./ archive/

          cp -a .git archive/

          # İzinleri yalnızca varsa düzelt
          find archive/.git -type d -exec chmod 755 {} +
          find archive/.git -type f -exec chmod 644 {} +

      - name: Zip
        run: |
          cd archive
          zip -r ../source-with-history.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: source-with-history
          path: source-with-history.zip
